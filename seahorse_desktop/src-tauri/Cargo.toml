[package]
name = "seahorse_desktop"
version = "1.0.0"
description = "海马智慧门店 (Seahorse Store) - 跨平台原生桌面收银与门店履约客户端 (Windows & macOS)"
authors = ["FWPT Seahorse Team"]
edition = "2021"
build = "build.rs"

[lib]
name = "seahorse_desktop_lib"
crate-type = ["rlib"]
test = false
doctest = false

[[bin]]
name = "seahorse_desktop"
path = "src/main.rs"
test = false

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
