import java.util.Properties

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = [
    rootProject.file("../key.properties"),
    rootProject.file("key.properties")
].find { it.exists() }
if (keystorePropertiesFile != null) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

def resolveSigningValue = { String envKey, String propKey ->
    def envVal = System.getenv(envKey)
    if (envVal != null && !envVal.trim().isEmpty()) {
        return envVal.trim()
    }
    def propVal = keystoreProperties.getProperty(propKey)
    return (propVal != null && !propVal.trim().isEmpty()) ? propVal.trim() : null
}

def envStoreFilePath = System.getenv("SEAHORSE_KEYSTORE_FILE")?.trim()
def propStoreFilePath = keystoreProperties.getProperty("storeFile")?.trim()
def releaseStoreFilePath = (envStoreFilePath && !envStoreFilePath.isEmpty()) ? envStoreFilePath : (propStoreFilePath ?: null)
def releaseStoreFile = null
if (releaseStoreFilePath) {
    def candidate = new File(releaseStoreFilePath)
    if (candidate.isAbsolute()) {
        releaseStoreFile = candidate
    } else if (envStoreFilePath && !envStoreFilePath.isEmpty()) {
        releaseStoreFile = rootProject.file(releaseStoreFilePath)
    } else if (keystorePropertiesFile != null) {
        releaseStoreFile = new File(keystorePropertiesFile.parentFile, releaseStoreFilePath)
    } else {
        releaseStoreFile = rootProject.file(releaseStoreFilePath)
    }
}
def releaseStorePassword = resolveSigningValue("SEAHORSE_KEYSTORE_PASSWORD", "storePassword")
def releaseKeyAlias = resolveSigningValue("SEAHORSE_KEY_ALIAS", "keyAlias")
def releaseKeyPassword = resolveSigningValue("SEAHORSE_KEY_PASSWORD", "keyPassword")
def hasReleaseSigning = releaseStoreFile != null && releaseStoreFile.exists() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def isReleaseTaskRequested = gradle.startParameter.taskNames.any {
    def lower = it.toLowerCase()
    lower.contains("release") || lower.contains("bundle")
}
if (isReleaseTaskRequested && !hasReleaseSigning) {
    throw new GradleException(
        "Missing Android release signing configuration! Provide seahorse_app/android/key.properties or SEAHORSE_KEYSTORE_* env vars (storeFile=${releaseStoreFilePath ?: 'unset'})."
    )
}

android {
    namespace "com.seahorse.store.app"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.seahorse.store.app"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeFile releaseStoreFile
                storePassword releaseStorePassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}
