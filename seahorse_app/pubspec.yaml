name: seahorse_app
description: "海马智慧门店 - 全场景门店履约跨平台移动端 APP (Android / iOS / HarmonyOS)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 状态管理
  provider: ^6.1.1
  # 网络请求
  dio: ^5.4.0
  # 本地持久化
  shared_preferences: ^2.2.2
  # 日期时间格式化
  intl: ^0.19.0
  # 扫码与二维码
  mobile_scanner: 5.2.3
  qr_flutter: ^4.1.0
  # 地理围栏定位
  geolocator: 13.0.2

dependency_overrides:
  geolocator_android: 4.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
