# ==============================================================================
# 海马智慧门店 (Seahorse Smart Store) - 本地开发调试环境配置文件 (application-dev.yml)
# ==============================================================================

# 开发环境日志输出配置 (继承主配置数据源，专注本地开发诊断与SQL跟踪)
logging:
  level:
    com.seahorse.store: DEBUG # 海马系统核心业务包日志级别设为 DEBUG，输出完整调用链路与入参回执
    org.springframework.web: INFO # Spring Web 请求路由处理框架日志级别设为 INFO
